name: Manuscript and archive checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/check_release.py
      - run: python scripts/export_tables.py --check
      - run: python experiments/sprint-6-noms/scripts/audit_paper.py
